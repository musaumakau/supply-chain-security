apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-decision-register-status
  annotations:
    policies.kyverno.io/title: Enforce Decision Register Status for Image Admission
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Gates admission on the decision register attestation status. Verifies that:
        1. A decision register attestation exists (custom predicate type)
        2. The decision.status in the predicate is ALLOWED
        3. The attestation was signed by the approved supply-chain-security workflow
      Blocks pods if any BLOCKED findings are recorded in the decision register.
      This enforcement follows supply chain revalidation analysis by DT + depscan.

spec:
  validationFailureAction: Enforce
  background: true

  rules:
    # -----------------------------------------------------------------------
    # Rule: Verify decision register attestation and gate on ALLOWED status
    # -----------------------------------------------------------------------
    - name: verify-decision-register-allowed
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - kube-system
                      - kyverno
                      - argocd
                      - crossplane-system
                      - cert-manager
      verifyImages:
        - imageReferences:
            - "europe-west1-docker.pkg.dev/stoked-citizen-455416-g4/supply-chain-security/*"

          attestations:
            # Custom predicate type: supply-chain-decision-register
            # Predicate URL: https://supply-chain.devlan.co/decision-register/v1
            - type: https://supply-chain.devlan.co/decision-register/v1
              attestors:
                - entries:
                    - keyless:
                        subject: "https://github.com/musaumakau/supply-chain-security/.github/workflows/revalidation.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev

              # Gate on decision.status == ALLOWED using CEL
              # The predicate contains:
              # {
              #   "decision": {
              #     "status": "ALLOWED" | "BLOCKED",
              #     "cve": "CVE-XXXX-XXXXX",
              #     "reason": "...",
              #     "vex_justification": "code_not_reachable" | null,
              #     "updated_at": "2026-09-24T..."
              #   }
              # }
              conditions:
                - all:
                    # CEL: extract decision.status and verify it is ALLOWED
                    - key: "{{ decision.status }}"
                      operator: Equals
                      value: "ALLOWED"

              mutateDigest: false
              verifyDigest: true
              required: true