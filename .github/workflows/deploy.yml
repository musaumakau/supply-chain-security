name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a manual build/sign/attest run'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  build-push:
    name: Build and Push
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    uses: ./.github/workflows/build-push.yml
    with:
      image-tag: ${{ github.sha }}
      push: true

  sbom-vex:
    name: SBOM and VEX (non-blocking)
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    uses: ./.github/workflows/sbom-vex.yml
    secrets:
      DT_URL: ${{ secrets.DT_URL }}
      DT_API_KEY: ${{ secrets.DT_API_KEY }}

  sign-attest:
    name: Sign and Attest
    needs: build-push
    uses: ./.github/workflows/sign-attest.yml
    with:
      digest: ${{ needs.build-push.outputs.digest }}

  verify:
    name: Verify
    needs: [build-push, sign-attest]
    uses: ./.github/workflows/verify.yml
    with:
      digest: ${{ needs.build-push.outputs.digest }}

  decision-register:
    name: Decision Register
    needs: [build-push, verify, sbom-vex]
    uses: ./.github/workflows/decision-register.yml
    with:
      digest: ${{ needs.build-push.outputs.digest }}
      sha: ${{ github.sha }}
      pipeline_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      DT_URL: ${{ secrets.DT_URL }}
      DT_API_KEY: ${{ secrets.DT_API_KEY }}