name: SBOM and VEX
on:
  workflow_call:
    secrets:
      DT_URL:
        required: true
      DT_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  cdxgen:
    name: CycloneDX SBOM + Reachability (depscan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set cache week
        id: date
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM and atom slices
        # Point at app/ subdirectory where requirements.txt and main.py live.
        # Scanning repo root produces an empty SBOM since cdxgen finds no Python manifests there.
        run: |
          mkdir -p bom-out
          chmod 777 bom-out
          docker run --rm --init \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ github.workspace }}/bom-out:/out" \
            -w /repo \
            ghcr.io/cyclonedx/cdxgen@sha256:29babac410b88a53c8fa60038b1b9a5c26764ccb84942ca77863acf90c86e288 \
            -t python --deep --evidence \
            -o /out/bom.cdx.json \
            /repo/app
          mv bom-out/bom.cdx.json bom.cdx.json
          echo "SBOM generated -- component count:"
          cat bom.cdx.json | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(len(d.get('components', [])))"

      - name: Cache depscan vulnerability database
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/vdb
          key: depscan-vdb-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}-${{ steps.date.outputs.week }}
          restore-keys: |
            depscan-vdb-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}-
            depscan-vdb-${{ runner.os }}-

      - name: Run depscan reachability analysis
        # Atom-based reachability analysis. Determines whether vulnerable functions
        # are actually reachable from application entry points, cutting triage noise
        # by 60-80% before any human review. Non-blocking: findings go to DT for triage.
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p reports /tmp/vdb && chmod 777 reports /tmp/vdb
          timeout -k 30 540 docker run --rm --init \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ github.workspace }}/reports:/reports" \
            -v /tmp/vdb:/vdb \
            -e VDB_HOME=/vdb \
            -w /repo \
            ghcr.io/owasp-dep-scan/dep-scan@sha256:134b031d8d21a4769eb30adea61778fd6f9c6d9fc3af5d8f6a10c12ee1c22357 \
              --profile research \
              -t python \
              --src /repo/app \
              --bom /repo/bom.cdx.json \
              --reports-dir /reports \
              --no-vuln-table
          echo "depscan reachability exit code: $?"

      - name: Upload SBOM to Dependency-Track
        # autoCreate=true creates the project on first push, no manual setup needed.
        # Non-blocking: DT being unreachable does not fail the pipeline.
        if: always()
        continue-on-error: true
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/dt-response.json -w "%{http_code}" \
            --max-time 30 \
            -X POST "${DT_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -H "Content-Type: multipart/form-data" \
            -F "autoCreate=true" \
            -F "projectName=${{ github.repository }}" \
            -F "projectVersion=${{ github.sha }}" \
            -F "bom=@bom.cdx.json")
          echo "Dependency-Track response: $HTTP_STATUS"
          cat /tmp/dt-response.json || true
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Warning: Dependency-Track upload returned $HTTP_STATUS"
          fi
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}

      - name: Upload SBOM and reachability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-vex-${{ github.sha }}
          path: |
            bom.cdx.json
            reports/
          retention-days: 30