name: SBOM and VEX
on:
  workflow_call:
permissions:
  contents: read
jobs:
  cdxgen:
    name: CycloneDX SBOM + Reachability (depscan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -------------------------------------------------------
      # Generate CycloneDX SBOM + atom reachability slices
      # -------------------------------------------------------
      - name: Generate CycloneDX SBOM and atom slices
        run: |
          chmod o+w "${{ github.workspace }}"
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/cyclonedx/cdxgen@sha256:29babac410b88a53c8fa60038b1b9a5c26764ccb84942ca77863acf90c86e288 \
            -t python --deep --evidence \
            -o /repo/bom.cdx.json \
            /repo/app
          echo "SBOM generated -- component count:"
          cat bom.cdx.json | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(len(d.get('components', [])))"

      # -------------------------------------------------------
      # Run depscan with the SBOM + atom slices for reachability
      # -------------------------------------------------------
      - name: Run depscan reachability analysis
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ github.workspace }}/reports:/reports" \
            -w /repo \
            ghcr.io/owasp-dep-scan/dep-scan@sha256:2c4e664db8637442e06603fab2caf1484acef5556fd7fb63a9950f824b2bcec7 \
            depscan \
              --profile research \
              -t python \
              --bom /repo/bom.cdx.json \
              --src /repo/app \
              --reports-dir /reports \
              --no-vuln-table || true

      # -------------------------------------------------------
      # Upload SBOM to Dependency-Track for continuous monitoring
      # autoCreate=true creates the project if it doesn't exist
      # projectName uses the repo name, version uses the git SHA
      # -------------------------------------------------------
      - name: Upload SBOM to Dependency-Track
        continue-on-error: true
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/dt-response.json -w "%{http_code}" \
            -X POST "${{ secrets.DT_URL }}/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DT_API_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "autoCreate=true" \
            -F "projectName=${{ github.repository }}" \
            -F "projectVersion=${{ github.sha }}" \
            -F "bom=@bom.cdx.json")
          echo "Dependency-Track response: $HTTP_STATUS"
          cat /tmp/dt-response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Warning: Dependency-Track upload returned $HTTP_STATUS"
          fi

      # -------------------------------------------------------
      # Upload SBOM and depscan reports as artifacts
      # -------------------------------------------------------
      - name: Upload SBOM and reachability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-vex-${{ github.sha }}
          path: |
            bom.cdx.json
            reports/
          retention-days: 30