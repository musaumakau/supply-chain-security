name: Decision Register
on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      sha:
        required: true
        type: string
      pipeline_url:
        required: true
        type: string
    secrets:
      DT_URL:
        required: true
      DT_API_KEY:
        required: true

env:
  GAR_LOCATION: europe-west1
  GAR_PROJECT_ID: stoked-citizen-455416-g4
  GAR_REPOSITORY: supply-chain-security
  IMAGE_NAME: supply-chain-demo

permissions:
  contents: write
  id-token: write

jobs:
  decision-register:
    name: Generate and Attest Decision Register
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need write access to commit the register back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Setup Cosign
        uses: ./.github/actions/setup-cosign

      - name: Query Dependency-Track for findings
        id: dt-query
        run: |
          # Look up project by name and version (SHA)
          PROJECT=$(curl -s \
            "${DT_URL}/api/v1/project?name=musaumakau%2Fsupply-chain-security&version=${{ inputs.sha }}" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -H "Accept: application/json")

          PROJECT_UUID=$(echo "$PROJECT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          projects = data if isinstance(data, list) else [data]
          for p in projects:
              if p.get('version') == '${{ inputs.sha }}':
                  print(p['uuid'])
                  break
          ")

          echo "project_uuid=${PROJECT_UUID}" >> "$GITHUB_OUTPUT"

          # Query metrics for this project
          METRICS=$(curl -s \
            "${DT_URL}/api/v1/metrics/project/${PROJECT_UUID}/current" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -H "Accept: application/json")

          CRITICAL=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('critical', 0))")
          HIGH=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('high', 0))")
          MEDIUM=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('medium', 0))")
          LOW=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('low', 0))")
          TOTAL=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('findingsTotal', 0))")
          SUPPRESSED=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('suppressed', 0))")
          COMPONENTS=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('components', 0))")

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
          echo "low=${LOW}" >> "$GITHUB_OUTPUT"
          echo "findings_total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "suppressed=${SUPPRESSED}" >> "$GITHUB_OUTPUT"
          echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"

          # Decision: ALLOWED if no critical or high unresolved findings
          if [ "$CRITICAL" -eq 0 ] && [ "$HIGH" -eq 0 ]; then
            echo "decision=ALLOWED" >> "$GITHUB_OUTPUT"
          else
            echo "decision=BLOCKED" >> "$GITHUB_OUTPUT"
          fi
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}

      - name: Generate decision register
        id: generate-register
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EXPIRY=$(date -u -d "+90 days" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v+90d +"%Y-%m-%dT%H:%M:%SZ")
          IMAGE_REF="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"

          mkdir -p releases

          cat > releases/decision-register-${{ inputs.sha }}.yaml << EOF
          apiVersion: supply-chain.devlan.co/v1
          kind: ReleaseDecision

          release:
            sha: ${{ inputs.sha }}
            image: ${IMAGE_REF}
            timestamp: ${TIMESTAMP}
            pipeline: ${{ inputs.pipeline_url }}

          decision:
            status: ${{ steps.dt-query.outputs.decision }}
            decided_by: ${{ github.actor }}
            decided_at: ${TIMESTAMP}
            expiry: ${EXPIRY}
            revalidation_triggers:
              - new_cve_for_component
              - vex_expiry
              - base_image_change
              - policy_change

          dependency_track:
            project_uuid: ${{ steps.dt-query.outputs.project_uuid }}
            project_version: ${{ inputs.sha }}
            components: ${{ steps.dt-query.outputs.components }}
            findings:
              critical: ${{ steps.dt-query.outputs.critical }}
              high: ${{ steps.dt-query.outputs.high }}
              medium: ${{ steps.dt-query.outputs.medium }}
              low: ${{ steps.dt-query.outputs.low }}
              total: ${{ steps.dt-query.outputs.findings_total }}
              suppressed: ${{ steps.dt-query.outputs.suppressed }}
          EOF

          echo "Register generated:"
          cat releases/decision-register-${{ inputs.sha }}.yaml

      - name: Attest decision register to image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"
        run: |
          cosign attest --yes \
            --predicate releases/decision-register-${{ inputs.sha }}.yaml \
            --type https://supply-chain.devlan.co/decision-register/v1 \
            "${IMAGE_DIGEST}"

      - name: Commit decision register to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/decision-register-${{ inputs.sha }}.yaml
          git commit -m "release decision: ${{ inputs.sha }} [${{ steps.dt-query.outputs.decision }}]"
          git push