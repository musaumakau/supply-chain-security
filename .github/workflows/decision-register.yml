name: Decision Register
on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      sha:
        required: true
        type: string
      pipeline_url:
        required: true
        type: string
    secrets:
      DT_URL:
        required: true
      DT_API_KEY:
        required: true

env:
  GAR_LOCATION: europe-west1
  GAR_PROJECT_ID: stoked-citizen-455416-g4
  GAR_REPOSITORY: supply-chain-security
  IMAGE_NAME: supply-chain-demo

permissions:
  contents: write
  id-token: write

jobs:
  decision-register:
    name: Generate and Attest Decision Register
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Setup Cosign
        uses: ./.github/actions/setup-cosign

      - name: Query Dependency-Track for findings
        id: dt-query
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          PROJECT=$(curl -s \
            "${DT_URL}/api/v1/project?name=musaumakau%2Fsupply-chain-security&version=${INPUT_SHA}" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -H "Accept: application/json")

          PROJECT_UUID=$(echo "$PROJECT" | python3 -c "
          import json, sys, os
          data = json.load(sys.stdin)
          sha = os.environ['INPUT_SHA']
          projects = data if isinstance(data, list) else [data]
          for p in projects:
              if p.get('version') == sha:
                  print(p['uuid'])
                  break
          ")

          echo "project_uuid=${PROJECT_UUID}" >> "$GITHUB_OUTPUT"

          METRICS=$(curl -s \
            "${DT_URL}/api/v1/metrics/project/${PROJECT_UUID}/current" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -H "Accept: application/json")

          CRITICAL=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('critical', 0))")
          HIGH=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('high', 0))")
          MEDIUM=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('medium', 0))")
          LOW=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('low', 0))")
          TOTAL=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('findingsTotal', 0))")
          SUPPRESSED=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('suppressed', 0))")
          COMPONENTS=$(echo "$METRICS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('components', 0))")

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
          echo "low=${LOW}" >> "$GITHUB_OUTPUT"
          echo "findings_total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "suppressed=${SUPPRESSED}" >> "$GITHUB_OUTPUT"
          echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"

          if [ "$CRITICAL" -eq 0 ] && [ "$HIGH" -eq 0 ]; then
            echo "decision=ALLOWED" >> "$GITHUB_OUTPUT"
          else
            echo "decision=BLOCKED" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate decision register
        id: generate-register
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PIPELINE_URL: ${{ inputs.pipeline_url }}
          INPUT_DIGEST: ${{ inputs.digest }}
          ACTOR: ${{ github.actor }}
          DT_DECISION: ${{ steps.dt-query.outputs.decision }}
          DT_PROJECT_UUID: ${{ steps.dt-query.outputs.project_uuid }}
          DT_COMPONENTS: ${{ steps.dt-query.outputs.components }}
          DT_CRITICAL: ${{ steps.dt-query.outputs.critical }}
          DT_HIGH: ${{ steps.dt-query.outputs.high }}
          DT_MEDIUM: ${{ steps.dt-query.outputs.medium }}
          DT_LOW: ${{ steps.dt-query.outputs.low }}
          DT_TOTAL: ${{ steps.dt-query.outputs.findings_total }}
          DT_SUPPRESSED: ${{ steps.dt-query.outputs.suppressed }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EXPIRY=$(date -u -d "+90 days" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v+90d +"%Y-%m-%dT%H:%M:%SZ")
          IMAGE_REF="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${INPUT_DIGEST}"

          mkdir -p releases

          # Generate JSON for cosign attestation (properly escaped via jq)
          jq -n \
            --arg sha "$INPUT_SHA" \
            --arg image "$IMAGE_REF" \
            --arg timestamp "$TIMESTAMP" \
            --arg pipeline "$INPUT_PIPELINE_URL" \
            --arg decision "$DT_DECISION" \
            --arg actor "$ACTOR" \
            --arg expiry "$EXPIRY" \
            --arg project_uuid "$DT_PROJECT_UUID" \
            --argjson components "$DT_COMPONENTS" \
            --argjson critical "$DT_CRITICAL" \
            --argjson high "$DT_HIGH" \
            --argjson medium "$DT_MEDIUM" \
            --argjson low "$DT_LOW" \
            --argjson total "$DT_TOTAL" \
            --argjson suppressed "$DT_SUPPRESSED" \
            '{
              apiVersion: "supply-chain.devlan.co/v1",
              kind: "ReleaseDecision",
              release: {
                sha: $sha,
                image: $image,
                timestamp: $timestamp,
                pipeline: $pipeline
              },
              decision: {
                status: $decision,
                decided_by: $actor,
                decided_at: $timestamp,
                expiry: $expiry,
                revalidation_triggers: [
                  "new_cve_for_component",
                  "vex_expiry",
                  "base_image_change",
                  "policy_change"
                ]
              },
              dependency_track: {
                project_uuid: $project_uuid,
                project_version: $sha,
                components: $components,
                findings: {
                  critical: $critical,
                  high: $high,
                  medium: $medium,
                  low: $low,
                  total: $total,
                  suppressed: $suppressed
                }
              }
            }' > "releases/decision-register-${INPUT_SHA}.json"

          echo "JSON register generated:"
          cat "releases/decision-register-${INPUT_SHA}.json"

          # Also generate YAML version for repo readability
          cat > "releases/decision-register-${INPUT_SHA}.yaml" << REGISTER
          apiVersion: supply-chain.devlan.co/v1
          kind: ReleaseDecision

          release:
            sha: ${INPUT_SHA}
            image: ${IMAGE_REF}
            timestamp: ${TIMESTAMP}
            pipeline: ${INPUT_PIPELINE_URL}

          decision:
            status: ${DT_DECISION}
            decided_by: ${ACTOR}
            decided_at: ${TIMESTAMP}
            expiry: ${EXPIRY}
            revalidation_triggers:
              - new_cve_for_component
              - vex_expiry
              - base_image_change
              - policy_change

          dependency_track:
            project_uuid: ${DT_PROJECT_UUID}
            project_version: ${INPUT_SHA}
            components: ${DT_COMPONENTS}
            findings:
              critical: ${DT_CRITICAL}
              high: ${DT_HIGH}
              medium: ${DT_MEDIUM}
              low: ${DT_LOW}
              total: ${DT_TOTAL}
              suppressed: ${DT_SUPPRESSED}
          REGISTER

          echo "register_filename=releases/decision-register-${INPUT_SHA}.json" >> "$GITHUB_OUTPUT"

      - name: Attest decision register to image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"
          REGISTER_FILE: ${{ steps.generate-register.outputs.register_filename }}
        run: |
          cosign attest --yes \
            --predicate "${REGISTER_FILE}" \
            --type https://supply-chain.devlan.co/decision-register/v1 \
            "${IMAGE_DIGEST}"

      - name: Commit decision register to repo
        env:
          INPUT_SHA: ${{ inputs.sha }}
          DT_DECISION: ${{ steps.dt-query.outputs.decision }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/decision-register-${INPUT_SHA}.*
          git commit -m "release decision: ${INPUT_SHA} [${DT_DECISION}]"
          git push
