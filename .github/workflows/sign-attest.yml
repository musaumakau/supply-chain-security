name: Sign and Attest
on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string

env:
  GAR_LOCATION: europe-west1
  GAR_PROJECT_ID: stoked-citizen-455416-g4
  GAR_REPOSITORY: supply-chain-security
  IMAGE_NAME: supply-chain-demo

permissions:
  contents: read
  id-token: write

jobs:
  sign-attest:
    name: Sign, SBOM, Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Setup Cosign
        uses: ./.github/actions/setup-cosign

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"
        run: |
          echo "Signing: ${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_DIGEST}"

      - name: Generate CycloneDX SBOM
        # Replaced Syft/SPDX with cdxgen/CycloneDX so all pipeline components
        # speak the same format: DT, depscan, decision register, and this attestation.
        env:
          IMAGE_DIGEST: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"
        run: |
          echo "Generating CycloneDX SBOM for: ${IMAGE_DIGEST}"
          mkdir -p bom-out && chmod 777 bom-out
          docker run --rm --init \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ github.workspace }}/bom-out:/out" \
            -w /repo \
            ghcr.io/cyclonedx/cdxgen@sha256:29babac410b88a53c8fa60038b1b9a5c26764ccb84942ca77863acf90c86e288 \
            -t python --deep --evidence \
            -o /out/bom.cdx.json \
            /repo/app
          mv bom-out/bom.cdx.json sbom.cdx.json
          echo "SBOM generated -- component count:"
          cat sbom.cdx.json | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(len(d.get('components', [])))"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cdx-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"
        run: |
          echo "Attaching CycloneDX SBOM attestation to: ${IMAGE_DIGEST}"
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type https://cyclonedx.org/bom \
            "${IMAGE_DIGEST}"

      - name: Generate and attest provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ inputs.digest }}"
          REPO: "${{ github.repository }}"
          COMMIT_SHA: "${{ github.sha }}"
          EVENT_NAME: "${{ github.event_name }}"
          GIT_REF: "${{ github.ref }}"
          WORKFLOW: "${{ github.workflow }}"
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r '.value')
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f2)
          PAYLOAD_PADDED="${PAYLOAD//_/\/}"
          PAYLOAD_PADDED="${PAYLOAD_PADDED//-/+}"
          MOD=$(( ${#PAYLOAD_PADDED} % 4 ))
          if [ $MOD -eq 2 ]; then PAYLOAD_PADDED="${PAYLOAD_PADDED}=="; fi
          if [ $MOD -eq 3 ]; then PAYLOAD_PADDED="${PAYLOAD_PADDED}="; fi

          JOB_WORKFLOW_REF=$(echo "$PAYLOAD_PADDED" | base64 -d | jq -r '.job_workflow_ref')
          ENTRY_POINT="${JOB_WORKFLOW_REF#${REPO}/}"
          ENTRY_POINT="${ENTRY_POINT%@*}"
          echo "Resolved entryPoint: ${ENTRY_POINT}"

          cat > provenance.json << PROVENANCE
          {
            "buildType": "https://github.com/Attestations/GitHubActionsWorkflow@v1",
            "builder": {
              "id": "https://github.com/actions/runner"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${REPO}@refs/heads/main",
                "digest": {
                  "sha1": "${COMMIT_SHA}"
                },
                "entryPoint": "${ENTRY_POINT}"
              },
              "parameters": {
                "event": "${EVENT_NAME}",
                "ref": "${GIT_REF}",
                "workflow": "${WORKFLOW}"
              }
            },
            "materials": [
              {
                "uri": "git+https://github.com/${REPO}",
                "digest": {
                  "sha1": "${COMMIT_SHA}"
                }
              }
            ]
          }
          PROVENANCE
          echo "Attaching provenance attestation to: ${IMAGE_DIGEST}"
          cosign attest --yes \
            --predicate provenance.json \
            --type slsaprovenance \
            "${IMAGE_DIGEST}"